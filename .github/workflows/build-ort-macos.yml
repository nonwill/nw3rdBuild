name: Build ONNXRUNTIME macos-shared

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ort-macos.yml'

env:
  ONNXRUNTIME_VERSION: "1.24.4"

jobs:
  build_macos_universal2:
    runs-on: macos-15-intel
    steps:
    - name: Install dependencies on macos
      run: |
        brew install curl unzip 7zip ninja tree
        cmake --version
        tree --version

    - name: Checkout ONNXRUNTIME-v${{ env.ONNXRUNTIME_VERSION }}
      uses: actions/checkout@v4
      with:
        repository: microsoft/onnxruntime
        submodules: true
        ref: v${{ env.ONNXRUNTIME_VERSION }}

    - name: Build ONNXRUNTIME-${{ env.ONNXRUNTIME_VERSION }} for macOS universal2
      shell: bash
      run: |
        extra_opt=""
        build_dir=./build-macos/universal2
        arch=universal2
        if [[ $arch == universal2 ]]; then
          arch="x86_64;arm64"
          extra_opt="--no_kleidiai"
          # sed -i.bak s/\"arm64e\",/\"x86_64\;arm64\",/g ./tools/ci_build/build.py
        fi

        sed -i.bak '/SOVERSION/d' ./cmake/onnxruntime.cmake
        git diff

        python3 ./tools/ci_build/build.py \
          --build_dir $build_dir \
          --config Release \
          --cmake_generator 'Ninja' \
          --update --build --use_xcode \
          --build_shared_lib \
          --compile_no_warning_as_error \
          --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=OFF \
          --cmake_extra_defines CMAKE_INSTALL_PREFIX=$build_dir/install/ \
          --cmake_extra_defines CMAKE_OSX_ARCHITECTURES="$arch" \
          --cmake_extra_defines CMAKE_OSX_SYSROOT=macosx \
          --cmake_extra_defines CMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
          --cmake_extra_defines CMAKE_POLICY_VERSION_MINIMUM=3.5 \
          --apple_sysroot macosx \
          --target install \
          --parallel \
          --skip_tests \
          --apple_deploy_target '10.10' \
          $extra_opt
          # see  https://github.com/microsoft/onnxruntime/pull/24194/files for why to use --no_kleidiai

    - name: Collect results
      id: vars
      shell: bash
      run: |
        echo "update_date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        build_dir=./build-macos/universal2

        ls -lh $build_dir

        version=${{ env.ONNXRUNTIME_VERSION }}
        artifact=onnxruntime-osx-universal2-$version

        current=$PWD

        if true; then
          ls -lh build-macos/universal2/Release/build-macos/universal2/install/lib/libonnxruntime.dylib
          mkdir -p $build_dir/Release

          ARTIFACT_NAME=$artifact
          LIB_NAME=libonnxruntime.dylib
          SOURCE_DIR=$PWD

          BINARY_DIR=build-macos/universal2/Release/build-macos/universal2

          # BINARY_DIR=$build_dir
          cd "$BINARY_DIR"
          mkdir -p $ARTIFACT_NAME/include

          mv -v install/include/onnxruntime/* $ARTIFACT_NAME/include/

          mkdir -p $ARTIFACT_NAME/lib
          cp -v install/lib/libonnxruntime.*.dylib $ARTIFACT_NAME/lib

          pushd $ARTIFACT_NAME/lib
          name=$(ls libonnxruntime.*.dylib)
          strip -S $name
          ln -s $name libonnxruntime.dylib

          popd

          #cp -v $SOURCE_DIR/include/onnxruntime/core/providers/coreml/coreml_provider_factory.h  $ARTIFACT_NAME/include

          cp -v $SOURCE_DIR/README.md $ARTIFACT_NAME/README.md
          cp -v $SOURCE_DIR/docs/Privacy.md $ARTIFACT_NAME/Privacy.md
          cp -v $SOURCE_DIR/LICENSE $ARTIFACT_NAME/LICENSE
          cp -v $SOURCE_DIR/ThirdPartyNotices.txt $ARTIFACT_NAME/ThirdPartyNotices.txt
          cp -v $SOURCE_DIR/VERSION_NUMBER $ARTIFACT_NAME/VERSION_NUMBER

          mv -v $ARTIFACT_NAME $current/
          cd $current
          echo "---"
          ls -lh
          echo "---"
          ls -lh $ARTIFACT_NAME
          echo "---"
          ls -lh $ARTIFACT_NAME/lib
          tree $ARTIFACT_NAME
        fi

        which tree
        tree ./$artifact

        zip -r ${artifact}.zip ./$artifact

    - uses: andreaswilli/delete-release-assets-action@v4.0.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        tag: onnxruntime-${{ env.ONNXRUNTIME_VERSION }}
        deleteOnlyFromDrafts: false

    - name: Upload onnxruntime-${{ env.ONNXRUNTIME_VERSION }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: onnxruntime-${{ env.ONNXRUNTIME_VERSION }}
        name: Latest build of onnxruntime-${{ env.ONNXRUNTIME_VERSION }}
        body: |
          date: ${{ steps.vars.outputs.update_date }}
        draft: false
        prerelease: false
        make_latest: true
        files: |
          "./onnxruntime-osx-*.zip"

